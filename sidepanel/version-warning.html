<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>浏览器版本提示</title>
  <style>
    body {
      margin: 0;
      padding: 40px 20px;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #181c24;
      color: #f3f6fa;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      box-sizing: border-box;
    }
    .container {
      max-width: 600px;
      background: #232936;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
    }
    h1 {
      font-size: 24px;
      margin: 0 0 20px;
      color: #f3f6fa;
    }
    p {
      font-size: 16px;
      line-height: 1.6;
      margin: 0 0 24px;
      color: #bfc9d9;
    }
    .version {
      font-size: 18px;
      font-weight: bold;
      color: #f59e42;
      margin: 16px 0;
    }
    .download-btn {
      display: inline-block;
      background: linear-gradient(90deg, #2563eb 0%, #1e40af 100%);
      color: #fff;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 500;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .download-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }
    .icon {
      width: 64px;
      height: 64px;
      margin-bottom: 24px;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="../icons/icon128.png" alt="GGPoker" class="icon">
    <h1>需要更新<span class="browser-name"> Chrome </span>浏览器</h1>
    <p>GGPoker记录下载助手需要 Chrome 或 Edge 116 及以上版本才能使用侧边栏功能。</p>
    <div class="version">当前版本：<span id="current-version">检测中...</span></div>
    <p>请更新您的<span class="browser-name"> Chrome </span>浏览器以获得最佳体验。</p>
    <a id="download-link" href="https://www.google.com/chrome/" target="_blank" class="download-btn">下载最新版<span class="browser-name"> Chrome </span></a>
  </div>
  <!-- MV3 扩展页面不允许内联脚本 -->
  <script src="version-warning.js"></script>
</body>
</html>
